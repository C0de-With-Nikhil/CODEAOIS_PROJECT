# pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeaois"
version = "0.3.1"
description = "Advanced AI Developer OS"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests",
    "python-dotenv",
    "rich",
    "prompt_toolkit"
]

[project.scripts]
codeaois = "codeaois.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeaois*"]