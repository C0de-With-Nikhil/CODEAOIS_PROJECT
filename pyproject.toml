[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeaois"
version = "0.1.0"
description = "Advanced AI Developer OS"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # We will add requests, rich, etc., here later
]

[project.scripts]
# This maps the terminal command to our Python function
codeaois = "codeaois.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeaois*"]